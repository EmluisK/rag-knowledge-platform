version: "3.9"

x-airflow-common: &airflow-common
 image: apache/airflow:2.8.1
 env_file: .env
 environment:
 AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
 AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
 AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
 AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
 AIRFLOW__CORE__LOAD_EXAMPLES: "false"
 AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
 # Pass RAG config into Airflow tasks
 MINIO_ENDPOINT: ${MINIO_ENDPOINT}
 MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
 MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
 MINIO_BUCKET: ${MINIO_BUCKET}
 POSTGRES_USER: ${POSTGRES_USER}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
 POSTGRES_DB: ${POSTGRES_DB}
 POSTGRES_HOST: ${POSTGRES_HOST}
 POSTGRES_PORT: ${POSTGRES_PORT}
 CHROMA_HOST: ${CHROMA_HOST}
 CHROMA_PORT: ${CHROMA_PORT}
 OLLAMA_HOST: ${OLLAMA_HOST}
 OLLAMA_PORT: ${OLLAMA_PORT}
 OLLAMA_MODEL: ${OLLAMA_MODEL}
 EMBEDDING_MODEL: ${EMBEDDING_MODEL}
 CHUNK_SIZE: ${CHUNK_SIZE}
 CHUNK_OVERLAP: ${CHUNK_OVERLAP}
 TOP_K: ${TOP_K}
 volumes:
 - ./dags:/opt/airflow/dags
 - ./scripts:/opt/airflow/scripts
 - airflow-logs:/opt/airflow/logs
 - airflow-plugins:/opt/airflow/plugins
 depends_on:
 postgres:
 condition: service_healthy

services:
 # ── PostgreSQL ──────────────────────────────────────────────
 postgres:
 image: postgres:15-alpine
 env_file: .env
 environment:
 POSTGRES_USER: ${POSTGRES_USER}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
 POSTGRES_DB: ${POSTGRES_DB}
 volumes:
 - postgres-data:/var/lib/postgresql/data
 - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
 ports:
 - "5450:5432"
 healthcheck:
 test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
 interval: 10s
 timeout: 5s
 retries: 5

 # ── MinIO ───────────────────────────────────────────────────
 minio:
 image: minio/minio:latest
 env_file: .env
 environment:
 MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
 MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
 volumes:
 - minio-data:/data
 ports:
 - "9100:9000"
 - "9101:9001"
 command: server /data --console-address ":9001"
 healthcheck:
 test: ["CMD", "mc", "ready", "local"]
 interval: 10s
 timeout: 5s
 retries: 5

 # ── MinIO Init ──────────────────────────────────────────────
 minio-init:
 image: minio/mc:latest
 env_file: .env
 depends_on:
 minio:
 condition: service_healthy
 entrypoint: >
 /bin/sh -c "
 mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
 mc mb --ignore-existing local/${MINIO_BUCKET};
 mc mb --ignore-existing local/${MINIO_BUCKET}/raw;
 mc mb --ignore-existing local/${MINIO_BUCKET}/processed;
 mc mb --ignore-existing local/${MINIO_BUCKET}/embeddings;
 echo 'MinIO buckets ready';
 "
 restart: "no"

 # ── ChromaDB ────────────────────────────────────────────────
 chromadb:
 image: chromadb/chroma:0.5.3
 volumes:
 - chroma-data:/chroma/chroma
 ports:
 - "8200:8000"
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
 interval: 10s
 timeout: 5s
 retries: 5

 # ── Airflow Init ────────────────────────────────────────────
 airflow-init:
 <<: *airflow-common
 entrypoint: /bin/bash
 command:
 - -c
 - |
 airflow db migrate
 airflow users create \
 --username ${AIRFLOW_WWW_USER_USERNAME} \
 --password ${AIRFLOW_WWW_USER_PASSWORD} \
 --firstname Admin \
 --lastname User \
 --role Admin \
 --email admin@example.com || true
 echo "Airflow initialized"
 restart: "no"

 # ── Airflow Webserver ───────────────────────────────────────
 airflow-webserver:
 <<: *airflow-common
 command: webserver
 ports:
 - "8180:8080"
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
 interval: 30s
 timeout: 10s
 retries: 5
 depends_on:
 postgres:
 condition: service_healthy
 airflow-init:
 condition: service_completed_successfully

 # ── Airflow Scheduler ───────────────────────────────────────
 airflow-scheduler:
 <<: *airflow-common
 command: scheduler
 depends_on:
 postgres:
 condition: service_healthy
 airflow-init:
 condition: service_completed_successfully

 # ── RAG API ─────────────────────────────────────────────────
 rag-api:
 build:
 context: ./app
 dockerfile: Dockerfile
 env_file: .env
 environment:
 MINIO_ENDPOINT: ${MINIO_ENDPOINT}
 MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
 MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
 MINIO_BUCKET: ${MINIO_BUCKET}
 POSTGRES_USER: ${POSTGRES_USER}
 POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
 POSTGRES_DB: ${POSTGRES_DB}
 POSTGRES_HOST: ${POSTGRES_HOST}
 POSTGRES_PORT: ${POSTGRES_PORT}
 CHROMA_HOST: ${CHROMA_HOST}
 CHROMA_PORT: ${CHROMA_PORT}
 OLLAMA_HOST: ${OLLAMA_HOST}
 OLLAMA_PORT: ${OLLAMA_PORT}
 OLLAMA_MODEL: ${OLLAMA_MODEL}
 EMBEDDING_MODEL: ${EMBEDDING_MODEL}
 CHUNK_SIZE: ${CHUNK_SIZE}
 CHUNK_OVERLAP: ${CHUNK_OVERLAP}
 TOP_K: ${TOP_K}
 ports:
 - "8100:8000"
 depends_on:
 postgres:
 condition: service_healthy
 minio:
 condition: service_healthy
 chromadb:
 condition: service_healthy
 minio-init:
 condition: service_completed_successfully
 extra_hosts:
 - "host.docker.internal:host-gateway"
 restart: unless-stopped

volumes:
 postgres-data:
 minio-data:
 chroma-data:
 airflow-logs:
 airflow-plugins:
